<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">
        <span class="theme-toggle-icon">🌙</span>
      </button>
    </header>

    <section class="summary-cards" id="summaryCards">
      <div class="card card-total">
        <span class="card-label">Total Expenses</span>
        <span class="card-value" id="totalExpense">₹0.00</span>
      </div>
      <div class="card card-transactions">
        <span class="card-label">Transactions Recorded</span>
        <span class="card-value" id="totalTransactions">0</span>
      </div>
      <div class="card card-days">
        <span class="card-label">Number of Days</span>
        <span class="card-value" id="totalDays">0</span>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab-btn" data-tab="new-expense">New Expense</button>
      <button class="tab-btn" data-tab="category-expense">Category Wise</button>
      <button class="tab-btn" data-tab="expense-history">Expense History</button>
    </nav>

    <main class="tab-content">
      <section class="tab-panel active" id="new-expense">
        <form id="expenseForm" class="expense-form" novalidate>
          <div class="form-group">
            <label for="expTitle">Title</label>
            <input type="text" id="expTitle" name="title" placeholder="e.g. Grocery Shopping" required />
          </div>
          <div class="form-group">
            <label for="expAmount">Amount (₹)</label>
            <input type="number" id="expAmount" name="amount" placeholder="0.00" min="0" step="10" required />
          </div>
          <div class="form-group">
            <label for="expCategory">Category</label>
            <select id="expCategory" name="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="expDate">Date</label>
            <input type="date" id="expDate" name="date" required />
          </div>
          <div class="form-group full-width">
            <label for="expNote">Note (optional)</label>
            <textarea id="expNote" name="note" rows="1" placeholder="additional details..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary full-width">Add Expense</button>
        </form>
      </section>

      <!-- Category Wise Tab -->
      <section class="tab-panel" id="category-expense">
        <form id="categoryFilterForm" class="filter-form">
          <div class="form-group">
            <label for="filterCategory">Filter by Category</label>
            <select id="filterCategory" name="filterCategory">
              <option value="all">All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </form>
        <div class="category-summary" id="categorySummary"></div>
        <div class="category-list" id="categoryList"></div>
      </section>

      <!-- Expense History Tab -->
      <section class="tab-panel" id="expense-history">
        <div class="history-controls">
          <div class="form-group">
            <label for="sortOrder">Sort by Date</label>
            <select id="sortOrder" name="sort">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
          <button id="resetAllExpenses" class="btn btn-danger">Reset All</button>
        </div>
        <div class="monthly-cards" id="monthlyCards"></div>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>
  </div>
</body>
</html>
