<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project One</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page-shell">
      <div class="sidebar-panel">
        <img class="sidebar-image" src="halie-west-25xggax4bSA-unsplash.jpg" alt="Mountain landscape" />
        <div class="sidebar-overlay">
          <div class="brand">ODIN</div>
        </div>
      </div>

      <form class="form-card" action="#" method="post">
          <h1>Let's do this!</h1>
          <div class="form-grid">
            <div class="field">
              <label for="name">First Name</label>
              <input id="name" name="name" type="text" placeholder="Enter your first name" />
            </div>
            <div class="field">
              <label for="last-name">Last Name</label>
              <input id="last-name" name="last-name" type="text" placeholder="Enter your last name" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" required type="email" placeholder="Enter your email" />
            </div>
            <div class="field">
              <label for="phone">Phone Number</label>
              <input id="phone" name="phone" required type="tel" placeholder="Enter your phone number" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" required type="password" />
            </div>
            <div class="field">
              <label for="confirm">Confirm Password</label>
              <input id="confirm" name="confirm" required type="password" />
            </div>
          </div>

          <div class="actions">
            <button type="submit">Create Account</button>
            <p class="login-link">Already have an account? <a href="#">Log in</a></p>
          </div>
        </form>
    </div>
  </body>
</html>
